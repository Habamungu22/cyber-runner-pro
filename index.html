<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER RUNNER PRO - Haba Technologie</title>
    <style>
        :root {
            --bg: #03050c;
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --panel-bg: rgba(10, 15, 28, 0.92);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.25);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(0, 243, 255, 0.4);
        }

        canvas {
            display: block;
            background: #020307;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .hud-card {
            background: var(--panel-bg);
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(5px);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 12, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        h1 {
            font-size: 32px;
            color: var(--neon-blue);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px var(--neon-blue);
        }

        .brand {
            color: var(--neon-yellow);
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .controls-info {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            color: #a0aab8;
            margin-bottom: 20px;
            line-height: 1.6;
            text-align: center;
        }

        .color-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: 0.2s;
        }

        .color-btn:hover { transform: scale(1.2); }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 12px 35px;
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="450" height="650"></canvas>

    <div class="hud">
        <div class="hud-card">SCORE: <span id="score" style="color: var(--neon-blue);">0</span></div>
        <div class="hud-card">RECORD: <span id="highScore" style="color: var(--neon-yellow);">0</span></div>
        <div class="hud-card">PIÈCES: <span id="coins" style="color: var(--neon-green);">0</span></div>
    </div>

    <!-- Menu Début -->
    <div id="startScreen" class="overlay">
        <h1>Cyber Runner Pro</h1>
        <div class="brand">HABA TECHNOLOGIE</div>

        <div class="controls-info">
            <b>Z / S ou HAUT / BAS :</b> Avancer / Reculer<br>
            <b>Q / D ou GAUCHE / DROITE :</b> Changer de voie<br>
            <b>ESPACE :</b> Sauter par-dessus les véhicules !
        </div>

        <div style="font-size: 12px; color: #8899a6; margin-bottom: 10px;">SELECTIONNE TON VÉHICULE :</div>
        <div class="color-selector">
            <div class="color-btn" style="background: #00f3ff;" onclick="selectColor('#00f3ff')"></div>
            <div class="color-btn" style="background: #ff0055;" onclick="selectColor('#ff0055')"></div>
            <div class="color-btn" style="background: #ffe600;" onclick="selectColor('#ffe600')"></div>
            <div class="color-btn" style="background: #00ff66;" onclick="selectColor('#00ff66')"></div>
        </div>

        <button class="btn" onclick="startGame()">DÉMARRER</button>
    </div>

    <!-- Menu Perdu -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: var(--neon-pink);">CRASH DÉTECTÉ</h1>
        <div class="brand">HABA TECHNOLOGIE</div>
        <p style="color: #a0aab8; text-align: center; line-height: 1.8;">
            Score Session : <b id="finalScore" style="color: #fff">0</b><br>
            Meilleur Record : <b id="bestScore" style="color: var(--neon-yellow)">0</b>
        </p>
        <button class="btn" onclick="startGame()">REPARTIR</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const lanes = [90, 225, 360];
let currentLane = 1;

// Position 2D du joueur
let playerX = lanes[1];
let playerY = 520;
let carColor = "#00f3ff";

// Système de saut
let isJumping = false;
let jumpHeight = 0;
let jumpTimer = 0;

// Variables système
let gameRunning = false;
let score = 0;
let highScore = localStorage.getItem("haba_pro_highscore") || 0;
let coinsCollected = 0;
let speed = 6;

let obstacles = [];
let coins = [];

document.getElementById("highScore").innerText = highScore;

function selectColor(color) {
    carColor = color;
}

// Touches enfoncées
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.code] = true;

    if (!gameRunning) return;

    // Changement de voie (Gauche / Droite)
    if ((e.code === "ArrowLeft" || e.code === "KeyA") && currentLane > 0) currentLane--;
    if ((e.code === "ArrowRight" || e.code === "KeyD") && currentLane < 2) currentLane++;

    // Action de saut sur ESPACE uniquement
    if (e.code === "Space" && !isJumping) {
        isJumping = true;
        jumpTimer = 0;
    }
});
window.addEventListener("keyup", e => keys[e.code] = false);

function startGame() {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");

    currentLane = 1;
    playerY = 520;
    score = 0;
    coinsCollected = 0;
    speed = 6;
    isJumping = false;
    jumpHeight = 0;
    obstacles = [];
    coins = [];
    gameRunning = true;

    loop();
}

function spawnEntities() {
    if (Math.random() < 0.038) {
        obstacles.push({ lane: Math.floor(Math.random() * 3), y: -60, color: "#ff0055" });
    }
    if (Math.random() < 0.025) {
        coins.push({ lane: Math.floor(Math.random() * 3), y: -60 });
    }
}

function update() {
    if (!gameRunning) return;

    score++;
    speed += 0.0012; // Accélération lente

    document.getElementById("score").innerText = Math.floor(score / 10);
    document.getElementById("coins").innerText = coinsCollected;

    // Fluidité du mouvement latéral (Transition vers la voie)
    let targetX = lanes[currentLane];
    playerX += (targetX - playerX) * 0.2;

    // Déplacement vertical (Monter / Descendre)
    if ((keys["ArrowUp"] || keys["KeyW"]) && playerY > 120) playerY -= 4.5;
    if ((keys["ArrowDown"] || keys["KeyS"]) && playerY < canvas.height - 70) playerY += 4.5;

    // Animation du saut
    if (isJumping) {
        jumpTimer += 0.07;
        jumpHeight = Math.sin(jumpTimer) * 45; // Altitude du saut

        if (jumpTimer >= Math.PI) {
            isJumping = false;
            jumpHeight = 0;
        }
    }

    spawnEntities();

    // Gestion Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed;

        let obsX = lanes[obs.lane];
        
        // Détection de collision précise en Y et X
        let distX = Math.abs(playerX - obsX);
        let distY = Math.abs(playerY - obs.y);

        if (distX < 35 && distY < 45) {
            // Si la voiture saute assez haut (jumpHeight > 25), elle esquive l'obstacle
            if (!isJumping || jumpHeight < 25) {
                gameOver();
            }
        }

        if (obs.y > canvas.height + 60) obstacles.splice(i, 1);
    }

    // Gestion Pièces
    for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += speed;

        let coinX = lanes[c.lane];
        let distX = Math.abs(playerX - coinX);
        let distY = Math.abs(playerY - c.y);

        if (distX < 30 && distY < 35) {
            coinsCollected++;
            score += 60;
            coins.splice(i, 1);
        } else if (c.y > canvas.height + 30) {
            coins.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Lignes de séparation des voies avec animation de défilement
    ctx.strokeStyle = "rgba(0, 243, 255, 0.15)";
    ctx.lineWidth = 2;
    ctx.setLineDash([30, 20]);
    ctx.lineDashOffset = -score * 2;
    ctx.beginPath();
    ctx.moveTo(157, 0); ctx.lineTo(157, canvas.height);
    ctx.moveTo(292, 0); ctx.lineTo(292, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Dessin des Pièces
    ctx.fillStyle = "#ffe600";
    ctx.shadowColor = "#ffe600";
    ctx.shadowBlur = 12;
    coins.forEach(c => {
        let x = lanes[c.lane];
        ctx.beginPath();
        ctx.arc(x, c.y, 11, 0, Math.PI * 2);
        ctx.fill();
    });

    // Dessin des Obstacles (Camions/Voitures ennemies)
    obstacles.forEach(obs => {
        let x = lanes[obs.lane];
        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 15;
        
        // Corps de l'obstacle
        ctx.fillRect(x - 22, obs.y - 30, 44, 60);
        
        // Feux arrière rouges clairs
        ctx.fillStyle = "#fff";
        ctx.fillRect(x - 18, obs.y + 25, 8, 4);
        ctx.fillRect(x + 10, obs.y + 25, 8, 4);
    });

    // Ombre sous la voiture pendant le saut
    if (isJumping) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.ellipse(playerX, playerY, 20 * (1 - jumpHeight / 80), 10 * (1 - jumpHeight / 80), 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Dessin du Véhicule du Joueur
    ctx.save();
    // Application de la position Y modifiée par le saut
    ctx.translate(playerX, playerY - jumpHeight);

    // Effet de réacteur néon sous le véhicule
    ctx.fillStyle = carColor;
    ctx.shadowColor = carColor;
    ctx.shadowBlur = isJumping ? 30 : 15;
    
    // Flamme du réacteur
    ctx.beginPath();
    ctx.moveTo(-10, 30);
    ctx.lineTo(0, 30 + Math.random() * 15 + 5);
    ctx.lineTo(10, 30);
    ctx.fill();

    // Carrosserie futuriste
    ctx.fillRect(-18, -28, 36, 56);

    // Vitre du cockpit
    ctx.fillStyle = "#020307";
    ctx.fillRect(-12, -12, 24, 18);

    // Phares avant
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-14, -28, 6, 4);
    ctx.fillRect(8, -28, 6, 4);

    ctx.restore();
    ctx.shadowBlur = 0;
}

function gameOver() {
    gameRunning = false;
    let finalScoreNum = Math.floor(score / 10);

    if (finalScoreNum > highScore) {
        highScore = finalScoreNum;
        localStorage.setItem("haba_pro_highscore", highScore);
        document.getElementById("highScore").innerText = highScore;
    }

    document.getElementById("finalScore").innerText = finalScoreNum;
    document.getElementById("bestScore").innerText = highScore;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}

function loop() {
    if (gameRunning) {
        update();
        draw();
        requestAnimationFrame(loop);
    }
}
</script>
</body>
</html>
