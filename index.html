<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER RUNNER PRO</title>
    <style>
        :root {
            --bg: #03050c;
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --panel-bg: rgba(10, 15, 28, 0.95);
        }

        * { box-sizing: border-box; user-select: none; touch-action: none; }

        body {
            margin: 0; padding: 0; background-color: var(--bg); color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; position: fixed; width: 100%; height: 100%;
        }

        #game-container {
            position: relative; box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
            border-radius: 12px; overflow: hidden; border: 2px solid rgba(0, 243, 255, 0.5);
            width: 450px; height: 100%; max-height: 750px; max-width: 100vw;
            display: flex; flex-direction: column;
        }

        canvas { display: block; background: #050714; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            font-family: monospace; font-size: 13px; font-weight: bold; z-index: 5;
        }

        .hud-card {
            background: var(--panel-bg); padding: 8px 12px; border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .touch-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 6;
        }

        .touch-btn {
            background: rgba(0, 243, 255, 0.15); border: 2px solid var(--neon-blue);
            color: var(--neon-blue); width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 12, 0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; padding: 20px;
        }

        h1 { font-size: 24px; color: var(--neon-blue); margin: 0; text-shadow: 0 0 15px var(--neon-blue); }
        .brand { color: var(--neon-yellow); font-family: monospace; font-size: 11px; margin-bottom: 12px; }

        .btn {
            background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink);
            padding: 12px 30px; font-size: 15px; font-family: monospace; font-weight: bold;
            cursor: pointer; border-radius: 6px; box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); width: 100%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="450" height="680"></canvas>

    <div class="hud">
        <div class="hud-card">SCORE: <span id="score" style="color: var(--neon-blue);">0</span></div>
        <div class="hud-card">PIÈCES: <span id="coins" style="color: var(--neon-green);">0</span></div>
    </div>

    <div class="touch-controls">
        <div class="touch-btn" id="btnLeft">◄</div>
        <div class="touch-btn" id="btnJump">▲</div>
        <div class="touch-btn" id="btnRight">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>Cyber Runner Pro</h1>
        <div class="brand">HABA TECHNOLOGIE</div>
        <p style="color: #a0aab8; font-size: 13px; text-align: center; margin-bottom: 20px;">
            Utilisez les flèches ou les boutons tactiles pour piloter la voiture Cyberpunk !
        </p>
        <button class="btn" onclick="startGame()">LANCER LA COURSE</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: var(--neon-pink);">CRASH DÉTECTÉ</h1>
        <div class="brand">HABA TECHNOLOGIE</div>
        <p style="color: #a0aab8; text-align: center; line-height: 1.8;">
            Score Session : <b id="finalScore" style="color: #fff">0</b><br>
            Pièces Gagnées : <b id="gainedCoins" style="color: var(--neon-green)">0</b>
        </p>
        <button class="btn" onclick="startGame()">RECOMMENCER</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const lanes = [90, 225, 360];
let currentLane = 1;
let playerX = lanes[1], playerY = 540;

let isJumping = false, jumpHeight = 0, jumpTimer = 0;
let gameRunning = false, score = 0, sessionCoins = 0, speed = 7;
let obstacles = [], coins = [];

function drawVectorCar(x, y, color, isPlayer = true) {
    ctx.save();
    ctx.translate(x, y - (isPlayer ? jumpHeight : 0));

    // Ombre sous la voiture
    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath();
    ctx.ellipse(0, 45 + (isPlayer ? jumpHeight : 0), 22, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Roues (4 roues)
    ctx.fillStyle = "#111";
    ctx.fillRect(-26, -30, 6, 16);
    ctx.fillRect(20, -30, 6, 16);
    ctx.fillRect(-26, 18, 6, 16);
    ctx.fillRect(20, 18, 6, 16);

    // Carrosserie principale
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(-20, -40, 40, 80, 8);
    ctx.fill();

    // Toit / Pare-brise sombre
    ctx.fillStyle = "#090d16";
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.roundRect(-14, -18, 28, 36, 4);
    ctx.fill();

    // Cockpit lumineux
    ctx.fillStyle = isPlayer ? "#00f3ff" : "#ff0055";
    ctx.fillRect(-10, -10, 20, 10);

    if (isPlayer) {
        // Feux Avant Néon (haut)
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 8;
        ctx.fillRect(-16, -38, 8, 4);
        ctx.fillRect(8, -38, 8, 4);

        // Réacteurs / Feux Arrière Néon
        ctx.fillStyle = "#ff0055";
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 10;
        ctx.fillRect(-14, 38, 8, 4);
        ctx.fillRect(6, 38, 8, 4);
    } else {
        // Feux pour les voitures d'obstacle
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(-16, -38, 8, 4);
        ctx.fillRect(8, -38, 8, 4);
    }

    ctx.restore();
}

function drawCoin(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#ffe600";
    ctx.shadowColor = "#ffe600";
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#000";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("💰", 0, 0);
    ctx.restore();
}

function triggerJump() {
    if (!isJumping) { isJumping = true; jumpTimer = 0; }
}

document.getElementById("btnLeft").onclick = () => { if (gameRunning && currentLane > 0) currentLane--; };
document.getElementById("btnRight").onclick = () => { if (gameRunning && currentLane < 2) currentLane++; };
document.getElementById("btnJump").onclick = () => { if (gameRunning) triggerJump(); };

window.addEventListener("keydown", e => {
    if (!gameRunning) return;
    if ((e.code === "ArrowLeft" || e.code === "KeyA") && currentLane > 0) currentLane--;
    if ((e.code === "ArrowRight" || e.code === "KeyD") && currentLane < 2) currentLane++;
    if (e.code === "Space" || e.code === "ArrowUp") triggerJump();
});

function startGame() {
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
    currentLane = 1; playerX = lanes[1];
    score = 0; sessionCoins = 0; speed = 7;
    isJumping = false; jumpHeight = 0;
    obstacles = []; coins = [];
    gameRunning = true;
    loop();
}

function update() {
    score++;
    speed += 0.001;
    document.getElementById("score").innerText = Math.floor(score / 10);
    document.getElementById("coins").innerText = sessionCoins;

    playerX += (lanes[currentLane] - playerX) * 0.25;

    if (isJumping) {
        jumpTimer += 0.07;
        jumpHeight = Math.sin(jumpTimer) * 60;
        if (jumpTimer >= Math.PI) { isJumping = false; jumpHeight = 0; }
    }

    if (Math.random() < 0.03) obstacles.push({ lane: Math.floor(Math.random() * 3), y: -80 });
    if (Math.random() < 0.03) coins.push({ lane: Math.floor(Math.random() * 3), y: -60 });

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += speed;
        if (Math.abs(playerX - lanes[obs.lane]) < 35 && Math.abs(playerY - obs.y) < 50) {
            if (!isJumping || jumpHeight < 30) gameOver();
        }
        if (obs.y > canvas.height + 80) obstacles.splice(i, 1);
    }

    for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += speed;
        if (Math.abs(playerX - lanes[c.lane]) < 30 && Math.abs(playerY - c.y) < 35) {
            sessionCoins++;
            coins.splice(i, 1);
        } else if (c.y > canvas.height + 40) coins.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Lignes de voie
    ctx.strokeStyle = "rgba(0, 243, 255, 0.2)";
    ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]);
    ctx.lineDashOffset = -score * 2;

    ctx.beginPath(); ctx.moveTo(167, 0); ctx.lineTo(167, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(292, 0); ctx.lineTo(292, canvas.height); ctx.stroke();
    ctx.setLineDash([]);

    // Dessin éléments
    coins.forEach(c => drawCoin(lanes[c.lane], c.y));
    obstacles.forEach(obs => drawVectorCar(lanes[obs.lane], obs.y, "#ff0055", false));
    drawVectorCar(playerX, playerY, "#00f3ff", true);
}

function gameOver() {
    gameRunning = false;
    document.getElementById("finalScore").innerText = Math.floor(score / 10);
    document.getElementById("gainedCoins").innerText = sessionCoins;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}

function loop() {
    if (gameRunning) {
        update();
        draw();
        requestAnimationFrame(loop);
    }
}
</script>
</body>
</html>
