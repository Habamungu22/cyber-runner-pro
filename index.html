<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CYBER RUNNER PRO - Garage Edition</title>
    <style>
        :root {
            --bg: #03050c;
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-purple: #b000ff;
            --panel-bg: rgba(10, 15, 28, 0.94);
        }

        * { box-sizing: border-box; user-select: none; touch-action: none; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(0, 243, 255, 0.5);
            width: 450px;
            height: 650px;
            max-width: 100vw;
            max-height: 100vh;
        }

        canvas { display: block; background: #050714; }

        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            z-index: 5;
            pointer-events: none;
        }

        .hud-card {
            background: var(--panel-bg);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .powerup-status {
            position: absolute;
            top: 60px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 5;
            font-family: monospace;
            font-size: 11px;
            pointer-events: none;
        }

        .badge {
            background: var(--panel-bg);
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid;
            display: none;
        }

        .badge.active { display: block; }
        .badge-shield { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: 0 0 8px var(--neon-blue); }
        .badge-magnet { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); }
        .badge-turbo { border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 8px var(--neon-yellow); }

        .music-btn {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--neon-blue);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            pointer-events: auto;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 5, 12, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
        }

        h1 {
            font-size: 26px;
            color: var(--neon-blue);
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--neon-blue);
        }

        .brand {
            color: var(--neon-yellow);
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .shop-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .shop-item {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
        }

        .shop-item.active {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .shop-item img {
            width: 35px;
            height: 55px;
            object-fit: contain;
        }

        .shop-info {
            flex-grow: 1;
        }

        .shop-title {
            font-weight: bold;
            font-size: 13px;
            color: #fff;
        }

        .shop-ability {
            font-size: 11px;
            color: #a0aab8;
            margin-top: 2px;
        }

        .shop-btn {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 11px;
            font-weight: bold;
        }

        .shop-btn.equipped {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 10px 30px;
            font-size: 15px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .btn:hover { 
            background: var(--neon-pink); 
            color: #fff; 
        }

        .total-coins-display {
            font-family: monospace;
            color: var(--neon-green);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="450" height="650"></canvas>

    <div class="hud">
        <div class="hud-card">
            SCORE: <span id="score" style="color: var(--neon-blue);">0</span>
            <span id="multiplier" style="color: var(--neon-yellow);">x1</span>
        </div>
        <div class="hud-card">PIÈCES: <span id="coins" style="color: var(--neon-green);">0</span></div>
        <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">🔊 AUDIO</button>
    </div>

    <div class="powerup-status">
        <div id="badgeShield" class="badge badge-shield">🛡️ BOUCLIER</div>
        <div id="badgeMagnet" class="badge badge-magnet">🧲 AIMANT (<span id="magnetTimer">0</span>s)</div>
        <div id="badgeTurbo" class="badge badge-turbo">⚡ TURBO (<span id="turboTimer">0</span>s)</div>
    </div>

    <!-- Écran Boutique & Démarrage -->
    <div id="startScreen" class="overlay">
        <h1>Cyber Runner Pro</h1>
        <div class="brand">HABA TECHNOLOGIE - GARAGE</div>

        <div class="total-coins-display">💰 SOLDE : <span id="totalCoins">0</span> PIÈCES</div>

        <div class="shop-container" id="shopList"></div>

        <button class="btn" onclick="startGame()">LANCER LA COURSE</button>
    </div>

    <!-- Écran Game Over -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: var(--neon-pink);">CRASH DÉTECTÉ</h1>
        <div class="brand">HABA TECHNOLOGIE</div>
        <p style="color: #a0aab8; text-align: center; line-height: 1.8;">
            Score Session : <b id="finalScore" style="color: #fff">0</b><br>
            Pièces Gagnées : <b id="gainedCoins" style="color: var(--neon-green)">0</b><br>
            Record : <b id="bestScore" style="color: var(--neon-yellow)">0</b>
        </p>
        <button class="btn" onclick="openShop()">GARAGE / BAZAR</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Base de Données des Voitures
const CARS = [
    { id: 0, name: "Cyber Runner", price: 0, filter: "none", ability: "Aucune capacité spéciale", color: "#00f3ff" },
    { id: 1, name: "Neon Interceptor", price: 100, filter: "hue-rotate(140deg) brightness(1.2)", ability: "⚡ Vitesse latérale +15%", color: "#ff0055" },
    { id: 2, name: "Phantom Glider", price: 250, filter: "hue-rotate(260deg) brightness(1.2)", ability: "🧲 Aimant passif permanent", color: "#00ff66" },
    { id: 3, name: "Hyper Titan", price: 500, filter: "hue-rotate(50deg) brightness(1.3)", ability: "🛡️ Démarre avec un Bouclier", color: "#ffe600" }
];

let bankCoins = parseInt(localStorage.getItem("cyber_bank_coins")) || 0;
let unlockedCars = JSON.parse(localStorage.getItem("cyber_unlocked_cars")) || [0];
let equippedCar = parseInt(localStorage.getItem("cyber_equipped_car")) || 0;

// Audio Synthétiseur
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicMuted = false;
let musicInterval = null;
let musicStep = 0;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleMusic() {
    musicMuted = !musicMuted;
    document.getElementById("musicToggleBtn").innerText = musicMuted ? "🔇 AUDIO" : "🔊 AUDIO";
    if (musicMuted) stopMusic();
    else if (gameRunning) startMusic();
}

function playSynthwaveNote() {
    if (!audioCtx || musicMuted || !gameRunning) return;
    const bassNotes = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98.00];
    const step = musicStep % bassNotes.length;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(bassNotes[step], audioCtx.currentTime);
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(350, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

    osc.connect(filter);
    filter.connect(bassGain = gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.12);
    musicStep++;
}

function startMusic() { stopMusic(); musicStep = 0; if (!musicMuted) musicInterval = setInterval(playSynthwaveNote, 120); }
function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }

function playSFX(freq1, freq2, type="sine", duration=0.2) {
    if (!audioCtx || musicMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// Images
const playerImg = new Image();
playerImg.src = 'https://svgsilh.com/svg/155823.svg';
const obstacleImg = new Image();
obstacleImg.src = 'https://svgsilh.com/svg/309878.svg';
const coinImg = new Image();
coinImg.src = 'https://svgsilh.com/svg/1314467.svg';

const lanes = [90, 225, 360];
let currentLane = 1;
let playerX = lanes[1];
let playerY = 520;

let isJumping = false;
let jumpHeight = 0;
let jumpTimer = 0;

let gameRunning = false;
let score = 0;
let multiplier = 1;
let highScore = localStorage.getItem("cyber_runner_hs") || 0;
let sessionCoins = 0;
let speed = 6;

let hasShield = false;
let magnetTimer = 0;
let turboTimer = 0;

let obstacles = [];
let coins = [];
let powerups = [];
let particles = [];

// Interface Magasin
function renderShop() {
    document.getElementById("totalCoins").innerText = bankCoins;
    const shopList = document.getElementById("shopList");
    shopList.innerHTML = "";

    CARS.forEach(car => {
        const isUnlocked = unlockedCars.includes(car.id);
        const isEquipped = equippedCar === car.id;

        let btnHTML = "";
        if (isEquipped) {
            btnHTML = `<button class="shop-btn equipped">ÉQUIPÉ</button>`;
        } else if (isUnlocked) {
            btnHTML = `<button class="shop-btn" onclick="equipCar(${car.id})">CHOISIR</button>`;
        } else {
            btnHTML = `<button class="shop-btn" style="border-color: var(--neon-yellow); color: var(--neon-yellow);" onclick="buyCar(${car.id})">${car.price} 💰</button>`;
        }

        shopList.innerHTML += `
            <div class="shop-item ${isEquipped ? 'active' : ''}">
                <img src="${playerImg.src}" style="filter: ${car.filter};" alt="${car.name}">
                <div class="shop-info">
                    <div class="shop-title" style="color: ${car.color}">${car.name}</div>
                    <div class="shop-ability">${car.ability}</div>
                </div>
                ${btnHTML}
            </div>
        `;
    });
}

function buyCar(id) {
    const car = CARS[id];
    if (bankCoins >= car.price) {
        bankCoins -= car.price;
        unlockedCars.push(id);
        equippedCar = id;
        saveProgress();
        renderShop();
        playSFX(400, 800, "triangle", 0.3);
    } else {
        playSFX(150, 80, "sawtooth", 0.2);
    }
}

function equipCar(id) {
    equippedCar = id;
    saveProgress();
    renderShop();
    playSFX(500, 700, "sine", 0.15);
}

function saveProgress() {
    localStorage.setItem("cyber_bank_coins", bankCoins);
    localStorage.setItem("cyber_unlocked_cars", JSON.stringify(unlockedCars));
    localStorage.setItem("cyber_equipped_car", equippedCar);
}

function openShop() {
    renderShop();
    document.getElementById("startScreen").classList.remove("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
}

// Contrôles
const keys = {};
window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (!gameRunning) return;

    if ((e.code === "ArrowLeft" || e.code === "KeyA") && currentLane > 0) currentLane--;
    if ((e.code === "ArrowRight" || e.code === "KeyD") && currentLane < 2) currentLane++;
    if (e.code === "Space" && !isJumping) { isJumping = true; jumpTimer = 0; playSFX(200, 500, "square", 0.15); }
});
window.addEventListener("keyup", e => keys[e.code] = false);

function startGame() {
    initAudio();
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");

    currentLane = 1;
    playerX = lanes[1];
    playerY = 520;
    score = 0;
    multiplier = 1;
    sessionCoins = 0;
    speed = 6;
    isJumping = false;
    jumpHeight = 0;
    magnetTimer = 0;
    turboTimer = 0;

    // Capacité Spéciale : Hyper Titan démarre avec un Bouclier
    hasShield = (equippedCar === 3);

    obstacles = [];
    coins = [];
    powerups = [];
    particles = [];
    gameRunning = true;

    updateUI();
    startMusic();
    loop();
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 20, color: color
        });
    }
}

function updateUI() {
    document.getElementById("badgeShield").classList.toggle("active", hasShield);
    document.getElementById("badgeMagnet").classList.toggle("active", magnetTimer > 0 || equippedCar === 2);
    document.getElementById("badgeTurbo").classList.toggle("active", turboTimer > 0);
    document.getElementById("multiplier").innerText = `x${multiplier}`;
}

function update() {
    if (!gameRunning) return;

    let currentSpeed = turboTimer > 0 ? speed * 1.8 : speed;
    score += multiplier;
    speed += 0.001;

    if (magnetTimer > 0) magnetTimer--;
    if (turboTimer > 0) turboTimer--;
    updateUI();

    document.getElementById("score").innerText = Math.floor(score / 10);
    document.getElementById("coins").innerText = sessionCoins;

    // Capacité Spéciale : Neon Interceptor va plus vite latéralement
    let moveSpeed = equippedCar === 1 ? 0.35 : 0.25;
    playerX += (lanes[currentLane] - playerX) * moveSpeed;

    if (isJumping) {
        jumpTimer += 0.07;
        jumpHeight = Math.sin(jumpTimer) * 55;
        if (jumpTimer >= Math.PI) { isJumping = false; jumpHeight = 0; }
    }

    // Traînée réacteur
    particles.push({
        x: playerX + (Math.random() - 0.5) * 10,
        y: playerY - jumpHeight + 35,
        vx: (Math.random() - 0.5) * 2,
        vy: Math.random() * 3 + 2,
        life: 12, color: CARS[equippedCar].color
    });

    // Spawns
    if (Math.random() < 0.035) obstacles.push({ lane: Math.floor(Math.random() * 3), y: -80 });
    if (Math.random() < 0.03) coins.push({ lane: Math.floor(Math.random() * 3), y: -60 });
    if (Math.random() < 0.008) {
        let types = ['shield', 'magnet', 'turbo'];
        powerups.push({ lane: Math.floor(Math.random() * 3), y: -60, type: types[Math.floor(Math.random() * types.length)] });
    }

    // Particules
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // Obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += currentSpeed;
        let obsX = lanes[obs.lane];

        if (Math.abs(playerX - obsX) < 35 && Math.abs(playerY - obs.y) < 50) {
            if (turboTimer > 0) {
                spawnParticles(obsX, obs.y, "#ff0055");
                obstacles.splice(i, 1);
            } else if (!isJumping || jumpHeight < 30) {
                if (hasShield) {
                    hasShield = false;
                    multiplier = 1;
                    spawnParticles(playerX, playerY, "#00f3ff");
                    obstacles.splice(i, 1);
                } else {
                    gameOver();
                }
            }
        }
        if (obs.y > canvas.height + 80) obstacles.splice(i, 1);
    }

    // Powerups
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += currentSpeed;

        if (Math.abs(playerX - lanes[p.lane]) < 35 && Math.abs(playerY - p.y) < 35) {
            if (p.type === 'shield') hasShield = true;
            if (p.type === 'magnet') magnetTimer = 360;
            if (p.type === 'turbo') turboTimer = 180;
            spawnParticles(lanes[p.lane], p.y, "#ffe600");
            playSFX(400, 800, "triangle", 0.25);
            powerups.splice(i, 1);
        } else if (p.y > canvas.height + 40) powerups.splice(i, 1);
    }

    // Pièces & Aimant (Inclus Phantom Glider passif)
    let hasActiveMagnet = magnetTimer > 0 || equippedCar === 2;
    let magnetRange = equippedCar === 2 ? 120 : 180;

    for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i];
        c.y += currentSpeed;

        if (hasActiveMagnet) {
            let dx = playerX - lanes[c.lane];
            let dy = playerY - c.y;
            if (Math.sqrt(dx * dx + dy * dy) < magnetRange) {
                lanes[c.lane] += dx * 0.12;
                c.y += dy * 0.12;
            }
        }

        if (Math.abs(playerX - lanes[c.lane]) < 30 && Math.abs(playerY - c.y) < 35) {
            sessionCoins++;
            if (sessionCoins % 10 === 0 && multiplier < 5) multiplier++;
            spawnParticles(lanes[c.lane], c.y, "#ffe600");
            playSFX(900, 1200, "sine", 0.15);
            coins.splice(i, 1);
        } else if (c.y > canvas.height + 40) coins.splice(i, 1);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grille Sol
    ctx.strokeStyle = "rgba(0, 243, 255, 0.15)";
    ctx.lineWidth = 1;
    let offset = (score * 3) % 40;
    for (let y = offset; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Voies
    ctx.strokeStyle = "rgba(0, 243, 255, 0.3)";
    ctx.lineWidth = 3;
    ctx.setLineDash([30, 20]);
    ctx.lineDashOffset = -score * 3;
    ctx.beginPath();
    ctx.moveTo(157, 0); ctx.lineTo(157, canvas.height);
    ctx.moveTo(292, 0); ctx.lineTo(292, canvas.height);
    ctx.stroke();
    ctx.setLineDash([]);

    // Particules
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.life / 4, 0, Math.PI * 2); ctx.fill();
    });

    // Pièces
    coins.forEach(c => {
        ctx.save();
        ctx.shadowColor = "#ffe600";
        ctx.shadowBlur = 8;
        ctx.drawImage(coinImg, lanes[c.lane] - 15, c.y - 15, 30, 30);
        ctx.restore();
    });

    // Powerups
    powerups.forEach(p => {
        ctx.save();
        ctx.font = "22px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let icon = p.type === 'shield' ? "🛡️" : (p.type === 'magnet' ? "🧲" : "⚡");
        ctx.fillText(icon, lanes[p.lane], p.y);
        ctx.restore();
    });

    // Obstacles
    obstacles.forEach(obs => {
        ctx.save();
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 12;
        ctx.drawImage(obstacleImg, lanes[obs.lane] - 25, obs.y - 40, 50, 80);
        ctx.restore();
    });

    // Voiture
    ctx.save();
    ctx.translate(playerX, playerY - jumpHeight);
    ctx.shadowColor = CARS[equippedCar].color;
    ctx.shadowBlur = turboTimer > 0 ? 35 : 15;
    ctx.filter = CARS[equippedCar].filter;
    ctx.drawImage(playerImg, -22, -40, 44, 80);
    ctx.restore();
}

function gameOver() {
    gameRunning = false;
    stopMusic();
    playSFX(100, 30, "sawtooth", 0.4);

    let finalScoreNum = Math.floor(score / 10);
    bankCoins += sessionCoins;
    saveProgress();

    if (finalScoreNum > highScore) {
        highScore = finalScoreNum;
        localStorage.setItem("cyber_runner_hs", highScore);
    }

    document.getElementById("finalScore").innerText = finalScoreNum;
    document.getElementById("gainedCoins").innerText = sessionCoins;
    document.getElementById("bestScore").innerText = highScore;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}

function loop() {
    if (gameRunning) {
        update();
        draw();
        requestAnimationFrame(loop);
    }
}

// Initialisation au chargement
renderShop();
</script>
</body>
</html>
