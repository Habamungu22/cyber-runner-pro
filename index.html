<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER RUNNER PRO - Conçu par Habamungu Haba</title>
    
    <meta name="theme-color" content="#00f3ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg: #03050c;
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --panel-bg: #0a0f1c;
        }

        * { box-sizing: border-box; user-select: none; touch-action: none; }

        body {
            margin: 0; padding: 0; background-color: var(--bg); color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; position: fixed; width: 100%; height: 100%;
        }

        #game-container {
            position: relative; box-shadow: 0 0 50px rgba(0, 243, 255, 0.3);
            border-radius: 12px; overflow: hidden; border: 2px solid rgba(0, 243, 255, 0.5);
            width: 450px; height: 100%; max-height: 750px; max-width: 100vw;
            display: flex; flex-direction: column;
        }

        canvas { display: block; background: #050714; width: 100%; height: 100%; }

        .hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            font-family: monospace; font-size: 12px; font-weight: bold; z-index: 5;
        }

        .hud-card {
            background: rgba(10, 15, 28, 0.85); padding: 8px 12px; border-radius: 6px;
            border: 1px solid rgba(0, 243, 255, 0.3);
        }

        .powerup-status {
            position: absolute; top: 60px; left: 15px;
            display: flex; flex-direction: column; gap: 6px; z-index: 5;
            font-family: monospace; font-size: 11px;
        }

        .badge {
            background: rgba(10, 15, 28, 0.85); padding: 4px 8px; border-radius: 4px;
            font-weight: bold; border: 1px solid; display: none;
        }

        .badge.active { display: block; }
        .badge-shield { border-color: var(--neon-blue); color: var(--neon-blue); }
        .badge-magnet { border-color: var(--neon-pink); color: var(--neon-pink); }
        .badge-turbo { border-color: var(--neon-yellow); color: var(--neon-yellow); }
        .badge-double { border-color: var(--neon-green); color: var(--neon-green); }

        .music-btn {
            background: rgba(10, 15, 28, 0.85); border: 1px solid rgba(0, 243, 255, 0.4);
            color: var(--neon-blue); padding: 8px 12px; border-radius: 6px;
            cursor: pointer; font-family: monospace; font-size: 11px; font-weight: bold;
        }

        .touch-controls {
            position: absolute; bottom: 20px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 6;
        }

        .touch-btn {
            background: rgba(0, 243, 255, 0.15); border: 2px solid var(--neon-blue);
            color: var(--neon-blue); width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;
        }

        .touch-btn:active {
            background: rgba(0, 243, 255, 0.5);
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #03050c !important; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10; padding: 20px;
        }

        h1 { font-size: 24px; color: var(--neon-blue); margin: 0; text-shadow: 0 0 15px var(--neon-blue); }
        .brand { color: var(--neon-yellow); font-family: monospace; font-size: 12px; font-weight: bold; margin-top: 4px; margin-bottom: 12px; letter-spacing: 1px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 12px; width: 100%; }

        .tab-btn {
            flex: 1; background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 10px; font-family: monospace; font-size: 12px;
            cursor: pointer; border-radius: 6px; text-align: center;
        }

        .tab-btn.active { border-color: var(--neon-blue); color: var(--neon-blue); background: #0c1428; }

        .content-container {
            width: 100%; display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 15px; max-height: 280px; overflow-y: auto;
        }

        .shop-item, .quest-card {
            background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; padding: 10px; display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
        }
        .shop-item.active { border-color: var(--neon-blue); }
        .car-preview { width: 24px; height: 38px; border-radius: 4px; border: 2px solid; flex-shrink: 0; }

        .btn-small {
            background: #050a14; border: 1px solid var(--neon-green);
            color: var(--neon-green); padding: 6px 12px; border-radius: 4px;
            cursor: pointer; font-family: monospace; font-size: 11px; font-weight: bold;
        }

        .btn-small:disabled {
            border-color: #334155; color: #64748b; background: transparent; cursor: not-allowed;
        }

        .btn-small.claimable {
            background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .btn {
            background: transparent; border: 2px solid var(--neon-pink); color: var(--neon-pink);
            padding: 12px 30px; font-size: 15px; font-family: monospace; font-weight: bold;
            cursor: pointer; border-radius: 6px; box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); width: 100%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="450" height="680"></canvas>

    <div class="hud">
        <div class="hud-card">SCORE: <span id="score" style="color: var(--neon-blue);">0</span> <span id="multiplier" style="color: var(--neon-yellow);">x1</span></div>
        <div class="hud-card">PIÈCES: <span id="coins" style="color: var(--neon-green);">0</span></div>
        <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">🔊 AUDIO</button>
    </div>

    <div class="powerup-status">
        <div id="badgeShield" class="badge badge-shield">🛡️ BOUCLIER</div>
        <div id="badgeMagnet" class="badge badge-magnet">🧲 AIMANT</div>
        <div id="badgeTurbo" class="badge badge-turbo">⚡ TURBO</div>
        <div id="badgeDouble" class="badge badge-double">2️⃣ PIÈCES x2</div>
    </div>

    <div class="touch-controls">
        <div class="touch-btn" id="btnLeft">◄</div>
        <div class="touch-btn" id="btnJump">▲</div>
        <div class="touch-btn" id="btnRight">►</div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>Cyber Runner Pro</h1>
        <div class="brand">Conçu par Haba technologie</div>

        <div style="font-family: monospace; color: var(--neon-green); font-size: 14px; margin-bottom: 10px;">
            💰 SOLDE : <span id="totalCoins">0</span> PIÈCES
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabGarage" onclick="switchTab('garage')">🚗 GARAGE</button>
            <button class="tab-btn" id="tabQuests" onclick="switchTab('quests')">🎯 MISSIONS</button>
        </div>

        <div class="content-container" id="garageView"></div>
        <div class="content-container hidden" id="questsView"></div>

        <button class="btn" onclick="startGame()">LANCER LA COURSE</button>
    </div>

    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: var(--neon-pink);">CRASH DÉTECTÉ</h1>
        <div class="brand">Conçu par Haba technologie</div>
        <p style="color: #a0aab8; text-align: center; line-height: 1.8;">
            Score Session : <b id="finalScore" style="color: #fff">0</b><br>
            Pièces Gagnées : <b id="gainedCoins" style="color: var(--neon-green)">0</b><br>
            Temps de Survie : <b id="survivedTime" style="color: var(--neon-blue)">0</b>s<br>
            Record : <b id="bestScore" style="color: var(--neon-yellow)">0</b>
        </p>
        <button class="btn" onclick="openMenu()">MENUS / GARAGE</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const CARS = [
    { id: 0, name: "Cyber Runner", price: 0, ability: "Aucune", color: "#00f3ff" },
    { id: 1, name: "Neon Interceptor", price: 100, ability: "Vitesse latérale Max", color: "#ff0055" },
    { id: 2, name: "Phantom Glider", price: 250, ability: "Aimant permanent", color: "#00ff66" },
    { id: 3, name: "Hyper Titan", price: 500, ability: "Bouclier au départ", color: "#ffe600" }
];

const QUESTS_DEF = [
    { id: "c30", title: "Collector", desc: "30 pièces en 1 partie", reward: 50 },
    { id: "t45", title: "Survivant", desc: "Survivre 45 secondes", reward: 75 },
    { id: "s1", title: "Invincible", desc: "Obtenir 1 Bouclier", reward: 40 }
];

let bankCoins = parseInt(localStorage.getItem("cyber_bank_coins")) || 0;
let unlockedCars = JSON.parse(localStorage.getItem("cyber_unlocked_cars")) || [0];
let equippedCar = parseInt(localStorage.getItem("cyber_equipped_car")) || 0;
let questState = JSON.parse(localStorage.getItem("cyber_quests_state")) || {
    c30: { done: false, claimed: false },
    t45: { done: false, claimed: false },
    s1: { done: false, claimed: false }
};

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let musicMuted = false;
let musicInterval = null;
let musicStep = 0;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleMusic() {
    musicMuted = !musicMuted;
    document.getElementById("musicToggleBtn").innerText = musicMuted ? "🔇 AUDIO" : "🔊 AUDIO";
    if (musicMuted) stopMusic(); else if (gameRunning) startMusic();
}

function playSynthwaveNote() {
    if (!audioCtx || musicMuted || !gameRunning) return;
    const bassNotes = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98.00];
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(bassNotes[musicStep % bassNotes.length], audioCtx.currentTime);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    musicStep++;
}

function startMusic() { stopMusic(); musicStep = 0; if (!musicMuted) musicInterval = setInterval(playSynthwaveNote, 130); }
function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }

function playSFX(freq1, freq2, type="sine", duration=0.2) {
    if (!audioCtx || musicMuted) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
}

const lanes = [90, 225, 360];
let currentLane = 1;
let playerX = lanes[1], playerY = 540;

let isJumping = false, jumpHeight = 0, jumpTimer = 0;
let gameRunning = false, score = 0, multiplier = 1, highScore = localStorage.getItem("cyber_runner_hs") || 0;
let sessionCoins = 0, speed = 5.0, gameStartTime = 0, sessionDuration = 0, shieldCollectedInSession = false;

let hasShield = false, magnetTimer = 0, turboTimer = 0, doubleCoinsTimer = 0;
let obstacles = [], coins = [], powerups = [], particles = [];

function switchTab(tab) {
    document.getElementById("tabGarage").classList.toggle("active", tab === 'garage');
    document.getElementById("tabQuests").classList.toggle("active", tab === 'quests');
    document.getElementById("garageView").classList.toggle("hidden", tab !== 'garage');
    document.getElementById("questsView").classList.toggle("hidden", tab !== 'quests');
}

function renderGarage() {
    const view = document.getElementById("garageView");
    view.innerHTML = "";
    CARS.forEach(car => {
        const isUnlocked = unlockedCars.includes(car.id);
        const isEquipped = equippedCar === car.id;
        let btnHTML = isEquipped ? `<button class="btn-small" style="border-color: var(--neon-blue); color: var(--neon-blue);">ÉQUIPÉ</button>` :
            (isUnlocked ? `<button class="btn-small" onclick="equipCar(${car.id})">CHOISIR</button>` :
            `<button class="btn-small" style="border-color: var(--neon-yellow); color: var(--neon-yellow);" onclick="buyCar(${car.id})">${car.price} 💰</button>`);

        view.innerHTML += `
            <div class="shop-item ${isEquipped ? 'active' : ''}">
                <div class="car-preview" style="background: ${car.color}; border-color: ${car.color};"></div>
                <div style="flex-grow: 1;">
                    <div style="font-weight: bold; font-size: 13px; color: ${car.color}">${car.name}</div>
                    <div style="font-size: 11px; color: #a0aab8;">${car.ability}</div>
                </div>
                ${btnHTML}
            </div>`;
    });
}

function renderQuests() {
    const view = document.getElementById("questsView");
    view.innerHTML = "";
    QUESTS_DEF.forEach(q => {
        const st = questState[q.id];
        let btnHTML = st.claimed ? `<button class="btn-small" disabled>REÇU</button>` :
            (st.done ? `<button class="btn-small claimable" onclick="claimQuest('${q.id}')">RÉCLAMER</button>` :
            `<button class="btn-small" disabled>EN COURS</button>`);

        view.innerHTML += `
            <div class="quest-card">
                <div>
                    <div style="font-size: 12px; font-weight: bold;">${q.title}</div>
                    <div style="font-size: 11px; color: #a0aab8;">${q.desc}</div>
                    <div style="color: var(--neon-yellow); font-family: monospace; font-size: 11px;">+${q.reward} PIÈCES</div>
                </div>
                ${btnHTML}
            </div>`;
    });
}

function updateCoinsDisplay() { document.getElementById("totalCoins").innerText = bankCoins; }

function claimQuest(id) {
    const q = QUESTS_DEF.find(item => item.id === id);
    if (q && questState[id].done && !questState[id].claimed) {
        bankCoins += q.reward; questState[id].claimed = true;
        saveProgress(); updateCoinsDisplay(); renderQuests(); playSFX(600, 1000, "triangle", 0.3);
    }
}

function buyCar(id) {
    const car = CARS[id];
    if (bankCoins >= car.price) {
        bankCoins -= car.price; unlockedCars.push(id); equippedCar = id;
        saveProgress(); updateCoinsDisplay(); renderGarage(); playSFX(400, 800, "triangle", 0.3);
    }
}

function equipCar(id) { equippedCar = id; saveProgress(); renderGarage(); playSFX(500, 700, "sine", 0.15); }

function saveProgress() {
    localStorage.setItem("cyber_bank_coins", bankCoins);
    localStorage.setItem("cyber_unlocked_cars", JSON.stringify(unlockedCars));
    localStorage.setItem("cyber_equipped_car", equippedCar);
    localStorage.setItem("cyber_quests_state", JSON.stringify(questState));
}

function openMenu() {
    updateCoinsDisplay(); renderGarage(); renderQuests();
    document.getElementById("startScreen").classList.remove("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");
}

function triggerJump() { if (!isJumping) { isJumping = true; jumpTimer = 0; playSFX(200, 500, "square", 0.15); } }

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 20, maxLife: 20, color: color
        });
    }
}

// Gestion tactile réactive sans lag
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnJump = document.getElementById("btnJump");

btnLeft.addEventListener("pointerdown", (e) => { e.preventDefault(); if (gameRunning && currentLane > 0) currentLane--; });
btnRight.addEventListener("pointerdown", (e) => { e.preventDefault(); if (gameRunning && currentLane < 2) currentLane++; });
btnJump.addEventListener("pointerdown", (e) => { e.preventDefault(); if (gameRunning) triggerJump(); });

window.addEventListener("keydown", e => {
    if (!gameRunning) return;
    if ((e.code === "ArrowLeft" || e.code === "KeyA") && currentLane > 0) currentLane--;
    if ((e.code === "ArrowRight" || e.code === "KeyD") && currentLane < 2) currentLane++;
    if (e.code === "Space" || e.code === "ArrowUp") triggerJump();
});

function startGame() {
    initAudio();
    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameOverScreen").classList.add("hidden");

    currentLane = 1; playerX = lanes[1]; playerY = 540;
    score = 0; multiplier = 1; sessionCoins = 0; speed = 5.0;
    isJumping = false; jumpHeight = 0; magnetTimer = 0; turboTimer = 0; doubleCoinsTimer = 0;
    gameStartTime = Date.now(); shieldCollectedInSession = false;

    hasShield = (equippedCar === 3);
    obstacles = []; coins = []; powerups = []; particles = [];
    gameRunning = true;

    updateUI(); startMusic(); loop();
}

function updateUI() {
    document.getElementById("badgeShield").classList.toggle("active", hasShield);
    document.getElementById("badgeMagnet").classList.toggle("active", magnetTimer > 0 || equippedCar === 2);
    document.getElementById("badgeTurbo").classList.toggle("active", turboTimer > 0);
    document.getElementById("badgeDouble").classList.toggle("active", doubleCoinsTimer > 0);
    document.getElementById("multiplier").innerText = `x${multiplier}`;
}

function checkQuests() {
    let now = Math.floor((Date.now() - gameStartTime) / 1000);
    if (sessionCoins >= 30) questState.c30.done = true;
    if (now >= 45) questState.t45.done = true;
    if (shieldCollectedInSession || hasShield) questState.s1.done = true;
    saveProgress();
}

function update() {
    if (!gameRunning) return;

    let currentSpeed = turboTimer > 0 ? speed * 1.5 : speed;
    score += multiplier;
    
    // Limitation de la vitesse maximale pour éviter que le jeu ne devienne incontrôlable
    if (speed < 9.5) {
        speed += 0.0005;
    }

    if (magnetTimer > 0) magnetTimer--;
    if (turboTimer > 0) turboTimer--;
    if (doubleCoinsTimer > 0) doubleCoinsTimer--;
    updateUI();

    checkQuests();

    document.getElementById("score").innerText = Math.floor(score / 10);
    document.getElementById("coins").innerText = sessionCoins;

    // Transition ultra rapide pour basculer d'une voie à l'autre sans latence
    let moveSpeed = equippedCar === 1 ? 0.65 : 0.50;
    playerX += (lanes[currentLane] - playerX) * moveSpeed;

    if (isJumping) {
        jumpTimer += 0.07;
        jumpHeight = Math.sin(jumpTimer) * 55;
        if (jumpTimer >= Math.PI) { isJumping = false; jumpHeight = 0; }
    }

    if (Math.random() < 0.03) obstacles.push({ lane: Math.floor(Math.random() * 3), y: -80, type: Math.random() < 0.2 ? 'laser' : 'car' });
    if (Math.random() < 0.028) coins.push({ lane: Math.floor(Math.random() * 3), y: -60 });
    if (Math.random() < 0.007) {
        let types = ['shield', 'magnet', 'turbo', 'double'];
        powerups.push({ lane: Math.floor(Math.random() * 3), y: -60, type: types[Math.floor(Math.random() * types.length)] });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i]; obs.y += currentSpeed;
        if (Math.abs(playerX - lanes[obs.lane]) < 35 && Math.abs(playerY - obs.y) < 50) {
            if (turboTimer > 0) {
                addParticles(lanes[obs.lane], obs.y, "#ff0055", 12);
                obstacles.splice(i, 1);
            } else if (obs.type === 'laser' && isJumping && jumpHeight > 25) {
                // Saut réussi au-dessus du laser
            } else if (!isJumping || jumpHeight < 30) {
                if (hasShield) {
                    hasShield = false; multiplier = 1;
                    addParticles(lanes[obs.lane], obs.y, "#00f3ff", 10);
                    obstacles.splice(i, 1); playSFX(300, 150, "sawtooth", 0.2);
                } else { gameOver(); }
            }
        } else if (obs.y > canvas.height + 80) obstacles.splice(i, 1);
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i]; p.y += currentSpeed;
        if (Math.abs(playerX - lanes[p.lane]) < 35 && Math.abs(playerY - p.y) < 35) {
            if (p.type === 'shield') { hasShield = true; shieldCollectedInSession = true; }
            if (p.type === 'magnet') magnetTimer = 360;
            if (p.type === 'turbo') turboTimer = 180;
            if (p.type === 'double') doubleCoinsTimer = 360;
            addParticles(lanes[p.lane], p.y, "#ffe600", 8);
            playSFX(400, 800, "triangle", 0.25); powerups.splice(i, 1);
        } else if (p.y > canvas.height + 40) powerups.splice(i, 1);
    }

    let hasActiveMagnet = magnetTimer > 0 || equippedCar === 2;
    for (let i = coins.length - 1; i >= 0; i--) {
        let c = coins[i]; c.y += currentSpeed;
        if (hasActiveMagnet && Math.sqrt(Math.pow(playerX - lanes[c.lane], 2) + Math.pow(playerY - c.y, 2)) < 150) {
            lanes[c.lane] += (playerX - lanes[c.lane]) * 0.12;
            c.y += (playerY - c.y) * 0.12;
        }
        if (Math.abs(playerX - lanes[c.lane]) < 30 && Math.abs(playerY - c.y) < 35) {
            sessionCoins += (doubleCoinsTimer > 0 ? 2 : 1);
            if (sessionCoins % 10 === 0 && multiplier < 5) multiplier++;
            addParticles(lanes[c.lane], c.y, "#ffe600", 6);
            playSFX(900, 1200, "sine", 0.15); coins.splice(i, 1);
        } else if (c.y > canvas.height + 40) coins.splice(i, 1);
    }
}

function drawVectorCar(x, y, color, isPlayer = true) {
    ctx.save();
    ctx.translate(x, y - (isPlayer ? jumpHeight : 0));

    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
    ctx.beginPath(); ctx.ellipse(0, 45 + (isPlayer ? jumpHeight : 0), 22, 8, 0, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = "#111";
    ctx.fillRect(-26, -30, 6, 16); ctx.fillRect(20, -30, 6, 16);
    ctx.fillRect(-26, 18, 6, 16); ctx.fillRect(20, 18, 6, 16);

    ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(-20, -40, 40, 80, 8); ctx.fill();

    ctx.fillStyle = "#090d16"; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.roundRect(-14, -18, 28, 36, 4); ctx.fill();

    ctx.fillStyle = isPlayer ? "#00f3ff" : "#ff0055";
    ctx.fillRect(-10, -10, 20, 10);

    if (isPlayer) {
        ctx.fillStyle = "#fff"; ctx.shadowColor = "#fff"; ctx.shadowBlur = 8;
        ctx.fillRect(-16, -38, 8, 4); ctx.fillRect(8, -38, 8, 4);

        ctx.fillStyle = "#ff0055"; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 10;
        ctx.fillRect(-14, 38, 8, 4); ctx.fillRect(6, 38, 8, 4);
    } else {
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(-16, -38, 8, 4); ctx.fillRect(8, -38, 8, 4);
    }
    ctx.restore();
}

function drawLaserBarrier(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 6; ctx.shadowColor = "#ff0055"; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.moveTo(-35, 0); ctx.lineTo(35, 0); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.fillRect(-40, -10, 8, 20); ctx.fillRect(32, -10, 8, 20);
    ctx.restore();
}

function drawCoin(x, y) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#ffe600"; ctx.shadowColor = "#ffe600"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("💰", 0, 0); ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(0, 243, 255, 0.2)"; ctx.lineWidth = 2;
    ctx.setLineDash([20, 20]); ctx.lineDashOffset = -score * 2;
    ctx.beginPath(); ctx.moveTo(167, 0); ctx.lineTo(167, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(292, 0); ctx.lineTo(292, canvas.height); ctx.stroke();
    ctx.setLineDash([]);

    coins.forEach(c => drawCoin(lanes[c.lane], c.y));
    powerups.forEach(p => {
        ctx.font = "22px sans-serif"; ctx.textAlign = "center";
        let icon = p.type === 'shield' ? "🛡️" : (p.type === 'magnet' ? "🧲" : (p.type === 'turbo' ? "⚡" : "2️⃣"));
        ctx.fillText(icon, lanes[p.lane], p.y);
    });

    obstacles.forEach(obs => {
        if (obs.type === 'laser') drawLaserBarrier(lanes[obs.lane], obs.y);
        else drawVectorCar(lanes[obs.lane], obs.y, "#ff0055", false);
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillRect(p.x, p.y, 4, 4);
    });
    ctx.globalAlpha = 1.0;

    drawVectorCar(playerX, playerY, CARS[equippedCar].color, true);
}

function gameOver() {
    gameRunning = false; stopMusic(); playSFX(100, 30, "sawtooth", 0.4);
    sessionDuration = Math.floor((Date.now() - gameStartTime) / 1000);
    let finalScoreNum = Math.floor(score / 10);
    bankCoins += sessionCoins;
    checkQuests(); saveProgress();

    if (finalScoreNum > highScore) { highScore = finalScoreNum; localStorage.setItem("cyber_runner_hs", highScore); }

    document.getElementById("finalScore").innerText = finalScoreNum;
    document.getElementById("gainedCoins").innerText = sessionCoins;
    document.getElementById("survivedTime").innerText = sessionDuration;
    document.getElementById("bestScore").innerText = highScore;
    document.getElementById("gameOverScreen").classList.remove("hidden");
}

function loop() { if (gameRunning) { update(); draw(); requestAnimationFrame(loop); } }

openMenu();

if ('serviceWorker' in navigator) {
    const swCode = `
        const CACHE_NAME = 'cyber-runner-v1';
        self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./', './index.html'])));
        });
        self.addEventListener('fetch', (e) => {
            e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
        });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}
</script>
